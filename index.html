<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>Papiernictvo - návrh rozloženia (mapa)</title>
<style>
  :root{
    --bg:#f4f2ec; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e3e0d8; --accent:#2E7D32; --shadow:0 6px 24px rgba(0,0,0,.14);
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171c; --panel:#1e2128; --ink:#eef0f4; --muted:#9aa2b1;
      --line:#2c313b; --shadow:0 6px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171c; --panel:#1e2128; --ink:#eef0f4; --muted:#9aa2b1;
    --line:#2c313b; --shadow:0 6px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;max-width:100%}
  header{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px}
  header .sub{font-size:11px;color:var(--muted);margin-top:1px}
  .badge{font-size:10px;background:#FFF3D6;color:#8A6D3B;border:1px solid #F0C36D;
    padding:2px 8px;border-radius:20px;font-weight:700}
  @media (prefers-color-scheme:dark){.badge{background:#3a3320;color:#e6c983;border-color:#6b5c2f}}
  .stage-wrap{flex:1;position:relative;overflow:hidden;background:
    radial-gradient(circle at 30% 20%, rgba(0,0,0,.03), transparent 60%)}
  .stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
  .stage.grabbing{cursor:grabbing}
  #svgHost{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #svgHost svg{display:block;width:760px;height:auto}
  .shelf{cursor:pointer;transition:opacity .18s}
  .shelf:hover rect{filter:brightness(.96)}
  .shelf.sel rect{stroke-width:3.4 !important;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
  .dim .shelf{opacity:.22}
  .dim .shelf.match{opacity:1}
  .ctrls{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .ctrls button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:20px;font-weight:700;box-shadow:var(--shadow);cursor:pointer}
  .ctrls button:active{transform:scale(.94)}
  .ctrls .rst{font-size:15px;font-weight:700}
  .legend{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--panel);
    border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    padding:6px 11px;border-radius:20px;border:1.5px solid var(--line);background:transparent;
    color:var(--ink);cursor:pointer;white-space:nowrap}
  .chip .dot{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.2)}
  .chip.active{border-color:var(--ink);background:rgba(0,0,0,.05)}
  @media (prefers-color-scheme:dark){.chip.active{background:rgba(255,255,255,.08)}}
  .hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);
    color:#fff;font-size:11.5px;padding:6px 12px;border-radius:20px;z-index:6;pointer-events:none;
    transition:opacity .4s}
  /* bottom sheet */
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top-left-radius:18px;
    border-top-right-radius:18px;box-shadow:var(--shadow);transform:translateY(102%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:20;max-height:70vh;overflow-y:auto}
  .sheet.open{transform:translateY(0)}
  .sheet .grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 4px}
  .sheet .body{padding:6px 18px 26px}
  .sheet .ztag{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:8px}
  .sheet h2{font-size:19px;margin:2px 0 2px}
  .sheet .meta{font-size:12px;color:var(--muted);margin-bottom:14px}
  .row{display:flex;gap:10px;margin:8px 0}
  .row .k{flex:0 0 78px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding-top:2px}
  .row .v{font-size:14px;font-weight:600;line-height:1.35}
  .v.now{color:var(--muted);font-weight:500}
  .v.arrow{color:var(--accent)}
  .why{background:rgba(46,125,50,.08);border:1px solid rgba(46,125,50,.25);border-radius:12px;
    padding:11px 13px;font-size:13px;line-height:1.45;margin-top:12px}
  .why b{color:var(--accent)}
  .closex{position:absolute;right:14px;top:12px;width:30px;height:30px;border-radius:50%;border:none;
    background:var(--line);color:var(--ink);font-size:16px;cursor:pointer}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;
    transition:opacity .28s;z-index:15}
  .scrim.show{opacity:1;pointer-events:auto}
</style>
</head>

island1", "cm": 100, "old": "Misc", "new": "Darčeky a drobnosti", "zone": "gift"}, "O1c": {"id": "O1c", "wall": "island1", "cm": 100, "old": "Misc", "new": "Darčekové balenie a mašle", "zone": "gift"}, "O1d": {"id": "O1d", "wall": "island1", "cm": 100, "old": "Misc", "new": "Oslava - sviečky, ozdoby, taniere", "zone": "gift", "note": "Pri pokladni - impulzný a maržový tovar."}, "O1e": {"id": "O1e", "wall": "island1", "cm": 100, "old": "Misc", "new": "Oslava - party potreby", "zone": "gift"}, "O1f": {"id": "O1f", "wall": "island1", "cm": 100, "old": "Misc", "new": "Sezónne / novinky", "zone": "gift"}, "O2a": {"id": "O2a", "wall": "island2", "cm": 96, "old": "Stojan", "new": "Sezónne pohľadnice a drobné darčeky", "zone": "gift"}, "O2b": {"id": "O2b", "wall": "island2", "cm": 107, "old": "Pohľadnice", "new": "Pohľadnice", "zone": "gift", "note": "Pekný stojan - nechať, blízko trasy k pokladni."}, "O2c": {"id": "O2c", "wall": "island2", "cm": 107, "old": "Pohľadnice", "new": "Pohľadnice a priania", "zone": "gift"}, "CASH": {"id": "CASH", "wall": "fixture", "cm": 100, "old": "Pokladňa", "new": "POKLADŇA + skener + tvrdý papier", "zone": "cash", "note": "Vyčistiť kartóny. Na pult a okolo drobný impulz."}, "XEROX": {"id": "XEROX", "wall": "fixture", "cm": 33, "old": "Xerox", "new": "XEROX / kopírovanie", "zone": "back", "note": "Zostáva. Prepojené s papierom H1."}}, "zones": {"child": {"name": "Detský svet", "fill": "#FFE0B2", "stroke": "#E8871E", "text": "#7A3E00"}, "write": {"name": "Písanie & škola", "fill": "#BBDEFB", "stroke": "#1565C0", "text": "#0B3D77"}, "paper": {"name": "Papier & formáty", "fill": "#B2EBF2", "stroke": "#00838F", "text": "#004D52"}, "office": {"name": "Kancelária & archív", "fill": "#C5CAE9", "stroke": "#3949AB", "text": "#1A237E"}, "gift": {"name": "Darčeky, oslava, pohľadnice", "fill": "#F8BBD0", "stroke": "#C2185B", "text": "#7A1341"}, "util": {"name": "Domácnosť & úžitkové", "fill": "#DCEDC8", "stroke": "#689F38", "text": "#33691E"}, "season": {"name": "Sezónna čelná zóna", "fill": "#FFCDD2", "stroke": "#D32F2F", "text": "#8E1616"}, "cash": {"name": "Pokladňa & impulz", "fill": "#90CAF9", "stroke": "#1976D2", "text": "#0B3D77"}, "back": {"name": "Zázemie / vstup", "fill": "#E0E0E0", "stroke": "#9E9E9E", "text": "#555555"}}};
const {shelves, zones} = DATA;

/* ---------- pan / zoom ---------- */
const stage = document.getElementById('stage');
const host  = document.getElementById('svgHost');
let scale=1, tx=0, ty=0, base=1;
function apply(){ host.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function fit(){
  const svg = host.querySelector('svg');
  const vb = svg.viewBox.baseVal;
  const rect = stage.getBoundingClientRect();
  const sw = 760; // css width of svg
  const sh = sw * (vb.height/vb.width);
  base = Math.min(rect.width/sw, rect.height/sh) * 0.98;
  scale = base;
  tx = (rect.width - sw*scale)/2;
  ty = (rect.height - sh*scale)/2;
  if(ty<8) ty=8;
  apply();
}
window.addEventListener('resize', fit);

/* wheel zoom */
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const f = e.deltaY<0 ? 1.12 : 1/1.12;
  zoomAt(mx,my,f);
},{passive:false});
function zoomAt(mx,my,f){
  const ns = Math.max(base*0.6, Math.min(scale*f, base*7));
  const k = ns/scale;
  tx = mx - (mx-tx)*k;
  ty = my - (my-ty)*k;
  scale = ns; apply();
}
document.getElementById('zin').onclick =()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.25)};
document.getElementById('zout').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.25)};
document.getElementById('rst').onclick =fit;

/* pointer drag + pinch */
let pts=new Map(), last=null, pinchD=0, moved=false, downT=0;
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  last={x:e.clientX,y:e.clientY}; moved=false; downT=Date.now();
  stage.classList.add('grabbing');
});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const r=stage.getBoundingClientRect();
    const mid={x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top};
    if(pinchD) zoomAt(mid.x,mid.y, d/pinchD);
    pinchD=d; moved=true; return;
  }
  const dx=e.clientX-last.x, dy=e.clientY-last.y;
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  tx+=dx; ty+=dy; last={x:e.clientX,y:e.clientY}; apply();
});
function up(e){
  stage.classList.remove('grabbing');
  pts.delete(e.pointerId); if(pts.size<2) pinchD=0;
  if(!moved && Date.now()-downT<400){ handleTap(e); }
}
stage.addEventListener('pointerup',up);
stage.addEventListener('pointercancel',up);

/* ---------- tap shelf ---------- */
function handleTap(e){
  let el=e.target.closest('.shelf');
  if(!el){ return; }
  const id=el.getAttribute('data-id');
  openSheet(id, el);
}
const hint=document.getElementById('hint');
let hintTimer=setTimeout(()=>{hint.style.opacity=0},3200);

function openSheet(id, el){
  const s=shelves[id]; if(!s)return;
  document.querySelectorAll('.shelf.sel').forEach(n=>n.classList.remove('sel'));
  if(el) el.classList.add('sel');
  const z=zones[s.zone];
  const body=document.getElementById('sheetBody');
  const note = s.note ? `<div class="why"><b>Prečo sem:</b> ${esc(s.note)}</div>` : '';
  const changed = (s.old||'').trim().toLowerCase() !== (s.new||'').trim().toLowerCase();
  body.innerHTML = `
    <span class="ztag" style="background:${z.fill};color:${z.text}">${esc(z.name)}</span>
    <h2>${esc(s.new)}</h2>
    <div class="meta">Regál ${esc(id)} • šírka ${s.cm} cm</div>
    <div class="row"><div class="k">Teraz tu je</div><div class="v now">${esc(s.old||'—')}</div></div>
    <div class="row"><div class="k">Návrh</div><div class="v arrow">${esc(s.new)} ${changed?'':'<span style="color:var(--muted);font-weight:500">(bez zmeny)</span>'}</div></div>
    ${note}`;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('scrim').classList.add('show');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
  document.querySelectorAll('.shelf.sel').forEach(n=>n.classList.remove('sel'));
}
document.getElementById('closex').onclick=closeSheet;
document.getElementById('scrim').onclick=closeSheet;

/* ---------- legend / zone filter ---------- */
const legend=document.getElementById('legend');
let activeZone=null;
const order=['season','child','write','paper','office','gift','util','cash'];
order.forEach(key=>{
  const z=zones[key]; if(!z)return;
  const c=document.createElement('button');
  c.className='chip'; c.dataset.zone=key;
  c.innerHTML=`<span class="dot" style="background:${z.fill};border-color:${z.stroke}"></span>${esc(z.name)}`;
  c.onclick=()=>toggleZone(key,c);
  legend.appendChild(c);
});
function toggleZone(key,chip){
  const host=document.getElementById('svgHost');
  if(activeZone===key){
    activeZone=null; host.classList.remove('dim');
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.shelf.match').forEach(n=>n.classList.remove('match'));
    return;
  }
  activeZone=key;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===chip));
  document.querySelectorAll('.shelf').forEach(n=>{
    const s=shelves[n.getAttribute('data-id')];
    n.classList.toggle('match', s && s.zone===key);
  });
  host.classList.add('dim');
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

fit();
</script>
